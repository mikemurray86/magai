# magai configuration file
# Location: ~/.config/magai/config.toml

# ── Top-level settings ───────────────────────────────────────────────────────

# Which model alias to use on startup — a [[named_models]] alias from below.
# An unknown value is an error, not a fallback: magai will not quietly start a
# different model than the one you named. (The exception: when an ollama
# provider is configured, or nothing is, an unknown value is read as a raw
# Ollama tag such as "qwen3:8b".)
#
# If omitted, magai uses the first [[named_models]] entry whose credentials are
# actually present (so one shared config works on machines that export
# different keys). If no entry names a model, magai does NOT guess one: it
# identifies a usable provider — a configured one, else ANTHROPIC_API_KEY /
# OPENAI_API_KEY / GROQ_API_KEY, else Ollama — lists that provider's models,
# and asks you to pick. If that lookup fails, it reports why.
#
# The choice is validated before the TUI opens, so a missing API key or an
# unreachable Ollama exits with a message instead of starting a session that
# fails on every turn.
default_model = "local"

# Controls when magai asks before executing a tool call.
#   ask-dangerous  — prompt only for write_file, edit_file, shell_command (default)
#   ask-always     — prompt for every tool call
#   auto           — never prompt; execute all tools silently
permission_mode = "ask-dangerous"

# Rough token limit for conversation history (4 chars ≈ 1 token).
# Older turns are trimmed automatically when this threshold is exceeded.
max_context_tokens = 80000

# Max number of turns (model replies + tool round-trips) the agent may take
# per user message before pausing to ask whether to continue. Default: 25.
max_turns = 25


# ── Providers ─────────────────────────────────────────────────────────────────
#
# Each entry configures how to reach a backend. The key (e.g. "openai" below)
# is referenced by `provider` in [[named_models]] entries.
# Supported types: ollama, openai, anthropic, groq, gemini

# Configuring an `ollama` provider here (or configuring no providers at all)
# is also what lets a bare model id be read as an Ollama tag.
[providers.ollama]
type = "ollama"
# Where the Ollama server lives. Defaults to http://localhost:11434; the
# $OLLAMA_API_BASE_URL environment variable is honoured when this is unset.
# base_url = "http://localhost:11434"

[providers.openai]
type = "openai"
api_key_env = "OPENAI_API_KEY"

[providers.anthropic]
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

# Use a custom base URL (e.g. a local OpenAI-compatible proxy)
# [providers.proxy]
# type = "openai"
# api_key_env = "PROXY_API_KEY"
# base_url = "http://localhost:8080/v1"
# Wire API for openai-type providers: "chat" (/chat/completions, the default
# and what every compatible server speaks) or "responses" (/responses).
# Some newer OpenAI models only accept the Responses API, including when
# reached through a proxy such as LiteLLM. A [[named_models]] entry can set
# its own `api` to override this for just that model.
# api = "responses"


# ── Named models ──────────────────────────────────────────────────────────────
#
# Define one or more models. Each gets an alias used with /model <alias>.
# `provider` must match a key from the [providers.*] tables above.

[[named_models]]
alias = "local"
provider = "ollama"
model = "granite4:latest"

[[named_models]]
alias = "gpt4o"
provider = "openai"
model = "gpt-4o"

[[named_models]]
alias = "sonnet"
provider = "anthropic"
model = "claude-sonnet-4-5"

# Optional per-model system prompt: replaces the default preamble
# (src/ai/preamble.md) entirely when this model is active. Project
# instructions (AGENTS.md/CLAUDE.md), if present, are still appended.
# `system_prompt` (inline) takes precedence over `system_prompt_file`
# (a path, relative to the cwd or absolute) if both are set.
# [[named_models]]
# alias = "reviewer"
# provider = "anthropic"
# model = "claude-sonnet-4-5"
# system_prompt = "You are a meticulous code reviewer. Only report bugs; never edit files."

# [[named_models]]
# alias = "proxy"
# provider = "proxy"
# model = "mistral-7b"
# system_prompt_file = ".magai/prompts/proxy-agent.md"

# A Responses-only model behind the same proxy: `api` overrides the
# provider's default for just this model.
# [[named_models]]
# alias = "gpt5-proxy"
# provider = "proxy"
# model = "gpt-5.6-sol"
# api = "responses"


# ── Checkpoints ──────────────────────────────────────────────────────────────
#
# magai snapshots the working tree after every turn so you can undo the agent's
# file changes. Snapshots live in a *shadow* git repository under
# $XDG_DATA_HOME/magai/checkpoints — your own repository is never written to:
# no commits, no index changes, no stash, no hooks. It works on a dirty tree,
# alongside your own commits, and in directories that aren't git repos at all.
#
# From inside magai:
#   /checkpoints   list saved checkpoints
#   /diff [n]      show what a turn changed
#   /undo          revert the last turn's file changes (leaves your own edits)
#   /redo          re-apply what /undo reverted
#   /restore <n>   reset the whole tree to checkpoint n

# [checkpoints]
# enabled = true
#
# Snapshot this directory instead of the auto-detected project root.
# root = "~/src/myproject"
#
# Where shadow repositories live.
# store = "~/.local/share/magai/checkpoints"
#
# How many checkpoints to keep before the oldest are pruned.
# keep = 200
#
# Extra gitignore-style patterns to leave out of snapshots.
# exclude = ["fixtures/large/", "*.sqlite"]
#
# The built-in exclude list covers build output (target/, dist/, node_modules/),
# caches and editor junk. It matters most in projects with no .gitignore, where
# a snapshot would otherwise try to capture target/ wholesale.
# use_default_excludes = true
#
# Copy the project's .git/info/exclude into the shadow repo, which cannot
# otherwise see it. Your .gitignore files are always honoured either way.
# copy_project_exclude = true
#
# Rows shown by /checkpoints, and the byte cap on /diff output.
# max_list = 50
# diff_max_bytes = 20000


# ── Quality tracking ─────────────────────────────────────────────────────────
#
# Persists a transcript of every session/turn (prompt, final response, tool
# calls, denial/failure counts) to the same sqlite db used by memory, for a
# future fine-tuning export. Off by default since it stores full conversation
# text. Rate the most recently finished turn from inside magai with
# `/rate good|bad|neutral [note]`.

# [quality]
# enabled = true
#
# When set, also asks this Ollama model to judge each finished turn
# ("good"/"bad"/"neutral" + a short rationale), stored alongside any manual
# /rate rating. Adds a background HTTP call per turn — omit to disable. Uses
# the endpoint from [providers.ollama].base_url / $OLLAMA_API_BASE_URL, and is
# a silent no-op if that endpoint is unreachable.
# judge_model = "granite4:latest"


# ── MCP servers ───────────────────────────────────────────────────────────────
#
# External tool providers via the Model Context Protocol. A server is reached
# either over stdio (set `command` — it is spawned as a child process on
# startup) or over streamable HTTP (set `url` — `url` wins if both are given).
#
# MCP tools go through the same approval gate and pre/post_tool_call hooks as
# built-in tools, and are treated as dangerous by default: under the default
# `ask-dangerous` permission mode every MCP call asks first. Set
# `trusted = true` on a server to exempt its tools from that prompt.
#
# A tool whose name is already taken (by a built-in tool or an earlier server)
# is skipped, with a warning in the TUI.
#
# `${VAR}` in a command, arg, url, env value, header value, or bearer_token is
# replaced with that environment variable, so tokens need not live in this file.
#
# Connecting is bounded by `timeout_secs` (default 30) so one unreachable
# server can't stall startup for the rest.
#
# These entries can be managed from the shell instead of by hand:
#   magai mcp add <name> <command> [args...]      magai mcp list [--check]
#   magai mcp add --transport http <name> <url>   magai mcp get <name>
#                                                 magai mcp remove <name>

# ── stdio ──
# [[mcp_servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
# trusted = true
# timeout_secs = 60      # a first `npx` run may download the server first

# [[mcp_servers]]
# name = "my-python-server"
# command = "python"
# args = ["-m", "my_mcp_server"]
# [mcp_servers.env]
# MY_SERVER_TOKEN = "${MY_SERVER_TOKEN}"

# ── remote (streamable HTTP) ──
# [[mcp_servers]]
# name = "remote-docs"
# url = "https://mcp.example.com/mcp"
# bearer_token = "${EXAMPLE_MCP_TOKEN}"   # sent as `Authorization: Bearer …`
# [mcp_servers.headers]                   # any extra headers
# X-Tenant = "acme"


# ── Plugins ───────────────────────────────────────────────────────────────────
#
# Plugins are discovered automatically from:
#   ~/.config/magai/plugins/<name>/plugin.toml  (global)
#   .magai/plugins/<name>/plugin.toml           (project-local, takes precedence)
#
# No configuration is needed here — just drop a plugin directory in place.
# Run /plugins inside magai to see what is loaded.


# ── Hooks ─────────────────────────────────────────────────────────────────────
#
# Shell commands triggered at lifecycle events. Hooks run as detached child
# processes (fire-and-forget) and do not block the agent.
#
# Events:
#   session_start   — when magai launches
#   session_stop    — when magai exits cleanly
#   pre_tool_call   — after approval, before a tool executes
#   post_tool_call  — after a tool completes
#   agent_response  — after the agent finishes a response turn
#
# Environment variables available to hook commands:
#   MAGAI_MODEL         — current model alias (session hooks)
#   MAGAI_TOOL_NAME     — tool name (tool hooks)
#   MAGAI_TOOL_INPUT    — JSON arguments passed to the tool (tool hooks)
#   MAGAI_TOOL_OUTPUT   — tool result string (post_tool_call only)
#   MAGAI_TOOL_SUCCESS  — "true" or "false" (post_tool_call only)

# Log every tool call to a file
# [[hooks]]
# event = "post_tool_call"
# command = "echo \"$(date -Is) $MAGAI_TOOL_NAME $MAGAI_TOOL_SUCCESS\" >> ~/.local/share/magai/tool.log"

# Notify when a long session ends
# [[hooks]]
# event = "session_stop"
# command = "notify-send 'magai' 'Session ended'"

# Ring the terminal bell after each agent response
# [[hooks]]
# event = "agent_response"
# command = "printf '\\a'"
