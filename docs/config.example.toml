# magai configuration file
# Location: ~/.config/magai/config.toml

# ── Top-level settings ───────────────────────────────────────────────────────

# Which model alias to use on startup (must match a [[named_models]] entry
# below). Falls back to "granite4:latest" via Ollama if omitted or not found.
default_model = "local"

# Controls when magai asks before executing a tool call.
#   ask-dangerous  — prompt only for write_file, edit_file, shell_command (default)
#   ask-always     — prompt for every tool call
#   auto           — never prompt; execute all tools silently
permission_mode = "ask-dangerous"

# Rough token limit for conversation history (4 chars ≈ 1 token).
# Older turns are trimmed automatically when this threshold is exceeded.
max_context_tokens = 80000

# Max number of turns (model replies + tool round-trips) the agent may take
# per user message before pausing to ask whether to continue. Default: 25.
max_turns = 25


# ── Providers ─────────────────────────────────────────────────────────────────
#
# Each entry configures how to reach a backend. The key (e.g. "openai" below)
# is referenced by `provider` in [[named_models]] entries.
# Supported types: ollama, openai, anthropic, groq, gemini

[providers.ollama]
type = "ollama"

[providers.openai]
type = "openai"
api_key_env = "OPENAI_API_KEY"

[providers.anthropic]
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

# Use a custom base URL (e.g. a local OpenAI-compatible proxy)
# [providers.proxy]
# type = "openai"
# api_key_env = "PROXY_API_KEY"
# base_url = "http://localhost:8080/v1"


# ── Named models ──────────────────────────────────────────────────────────────
#
# Define one or more models. Each gets an alias used with /model <alias>.
# `provider` must match a key from the [providers.*] tables above.

[[named_models]]
alias = "local"
provider = "ollama"
model = "granite4:latest"

[[named_models]]
alias = "gpt4o"
provider = "openai"
model = "gpt-4o"

[[named_models]]
alias = "sonnet"
provider = "anthropic"
model = "claude-sonnet-4-5"

# [[named_models]]
# alias = "proxy"
# provider = "proxy"
# model = "mistral-7b"


# ── MCP servers ───────────────────────────────────────────────────────────────
#
# External tool providers via the Model Context Protocol.
# Each server is spawned as a child process on startup.

# [[mcp_servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

# [[mcp_servers]]
# name = "my-python-server"
# command = "python"
# args = ["-m", "my_mcp_server"]
# [mcp_servers.env]
# MY_SERVER_TOKEN = "secret"


# ── Plugins ───────────────────────────────────────────────────────────────────
#
# Plugins are discovered automatically from:
#   ~/.config/magai/plugins/<name>/plugin.toml  (global)
#   .magai/plugins/<name>/plugin.toml           (project-local, takes precedence)
#
# No configuration is needed here — just drop a plugin directory in place.
# Run /plugins inside magai to see what is loaded.


# ── Hooks ─────────────────────────────────────────────────────────────────────
#
# Shell commands triggered at lifecycle events. Hooks run as detached child
# processes (fire-and-forget) and do not block the agent.
#
# Events:
#   session_start   — when magai launches
#   session_stop    — when magai exits cleanly
#   pre_tool_call   — after approval, before a tool executes
#   post_tool_call  — after a tool completes
#   agent_response  — after the agent finishes a response turn
#
# Environment variables available to hook commands:
#   MAGAI_MODEL         — current model alias (session hooks)
#   MAGAI_TOOL_NAME     — tool name (tool hooks)
#   MAGAI_TOOL_INPUT    — JSON arguments passed to the tool (tool hooks)
#   MAGAI_TOOL_OUTPUT   — tool result string (post_tool_call only)
#   MAGAI_TOOL_SUCCESS  — "true" or "false" (post_tool_call only)

# Log every tool call to a file
# [[hooks]]
# event = "post_tool_call"
# command = "echo \"$(date -Is) $MAGAI_TOOL_NAME $MAGAI_TOOL_SUCCESS\" >> ~/.local/share/magai/tool.log"

# Notify when a long session ends
# [[hooks]]
# event = "session_stop"
# command = "notify-send 'magai' 'Session ended'"

# Ring the terminal bell after each agent response
# [[hooks]]
# event = "agent_response"
# command = "printf '\\a'"
